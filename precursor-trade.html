<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />

<title>Fuyu V - Precursor Apparatus Trade Rechner</title>
<link rel="stylesheet" href="style.css" />
<style>
  .tool-box {
    max-width: 520px;
    margin: 0 auto;
    text-align: left;
  }
  .ign-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  .ign-row input {
    width: 100%;
    box-sizing: border-box;
  }
  .ign-status {
    font-size: 0.8em;
    min-height: 1.2em;
    margin-bottom: 10px;
    opacity: 0.85;
  }
  .ign-status.error {
    color: #ff8080;
  }
  .ign-status.ok {
    color: #8fd18f;
  }
  .tool-row {
    display: grid;
    grid-template-columns: 1fr 70px 70px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .tool-row input {
    width: 100%;
    box-sizing: border-box;
    text-align: center;
  }
  .tool-header {
    display: grid;
    grid-template-columns: 1fr 70px 70px;
    gap: 8px;
    font-size: 0.85em;
    margin-bottom: 6px;
    opacity: 0.8;
  }
  .trade-line {
    margin: 6px 0;
    padding: 8px 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
  }
  #output {
    margin-top: 1.2em;
  }
  .section-label {
    font-size: 0.85em;
    opacity: 0.7;
    margin: 1em 0 4px;
  }
</style>
</head>

<body class="body">
<div class="rose-strip" id="roseStrip"></div>

<script src="roses.js"></script>

<div class="petal-layer" id="petalLayer" aria-hidden="true"></div>
<script src="petals.js"></script>

<div class="element">
<h1>Precursor Apparatus Trade Rechner</h1>
</div>

<div class="element tool-box">
<p>Trag eure Bestände ein (manuell oder automatisch per Hypixel-Account) und findet raus, wer wem was gegen was tauschen sollte (immer 1:1).</p>

<div class="section-label">Spieler 1 - automatisch laden (optional)</div>
<div class="ign-row">
  <input type="text" id="p1-ign" placeholder="Minecraft-Name" maxlength="16" />
  <button class="button1" id="p1-load">Laden</button>
</div>
<div class="ign-status" id="p1-status"></div>

<div class="section-label">Spieler 2 - automatisch laden (optional)</div>
<div class="ign-row">
  <input type="text" id="p2-ign" placeholder="Minecraft-Name" maxlength="16" />
  <button class="button1" id="p2-load">Laden</button>
</div>
<div class="ign-status" id="p2-status"></div>

<div class="tool-header">
  <div>Teil</div>
  <div>Spieler 1</div>
  <div>Spieler 2</div>
</div>

<div id="rows"></div>

<button class="button1" id="calcBtn">Trades berechnen</button>

<div id="output"></div>
</div>

<div class="element">
<a href="tools.html"><button class="button1">Zurück zu Tools</button></a>
</div>

<script>
  const parts = [
    { label: "Synthetic Heart", key: "SyntheticHeart" },
    { label: "Superlite Motor", key: "SuperliteMotor" },
    { label: "Robotron Reflector", key: "RobotronReflector" },
    { label: "FTX 3070", key: "FTX3070" },
    { label: "Electron Transmitter", key: "ElectronTransmitter" },
    { label: "Control Switch", key: "ControlSwitch" },
  ];

  const rowsEl = document.getElementById("rows");
  rowsEl.innerHTML = parts
    .map(
      (p, i) => `
    <div class="tool-row">
      <div>${p.label}</div>
      <input type="number" min="0" step="1" value="0" id="p1-${i}" />
      <input type="number" min="0" step="1" value="0" id="p2-${i}" />
    </div>`
    )
    .join("");

  async function loadFromHypixel(playerNum) {
    const ignInput = document.getElementById(`p${playerNum}-ign`);
    const statusEl = document.getElementById(`p${playerNum}-status`);
    const ign = ignInput.value.trim();

    if (!ign) {
      statusEl.textContent = "Bitte einen Namen eingeben.";
      statusEl.className = "ign-status error";
      return;
    }

    statusEl.textContent = "Lade...";
    statusEl.className = "ign-status";

    try {
      const res = await fetch(`/api/precursor?ign=${encodeURIComponent(ign)}`);
      const data = await res.json();

      if (!data.success) {
        statusEl.textContent = data.error || "Unbekannter Fehler.";
        statusEl.className = "ign-status error";
        return;
      }

      parts.forEach((p, i) => {
        document.getElementById(`p${playerNum}-${i}`).value = data.counts[p.key] ?? 0;
      });

      if (data.debugSampleKeys) {
        statusEl.textContent = `Geladen, aber keiner der 6 Teile gefunden. Beispiel-Sack-Keys: ${data.debugSampleKeys.join(", ")}`;
        statusEl.className = "ign-status error";
      } else {
        statusEl.textContent = `Geladen: ${data.ign} (${data.profileName})`;
        statusEl.className = "ign-status ok";
      }
    } catch (e) {
      statusEl.textContent = "Verbindung fehlgeschlagen.";
      statusEl.className = "ign-status error";
    }
  }

  document.getElementById("p1-load").addEventListener("click", () => loadFromHypixel(1));
  document.getElementById("p2-load").addEventListener("click", () => loadFromHypixel(2));

  function calcTrades() {
    const p1 = parts.map((_, i) => parseInt(document.getElementById(`p1-${i}`).value) || 0);
    const p2 = parts.map((_, i) => parseInt(document.getElementById(`p2-${i}`).value) || 0);

    const p1Name = document.getElementById("p1-ign").value.trim() || "Spieler 1";
    const p2Name = document.getElementById("p2-ign").value.trim() || "Spieler 2";

    const p1CraftsBefore = Math.min(...p1);
    const p2CraftsBefore = Math.min(...p2);

    // Engpass-basierter Tausch: statt nur die Differenz zwischen den beiden
    // Spielern zu betrachten, sucht dieser Algorithmus iterativ nach Swaps,
    // die den eigenen Engpass (das Minimum der 6 Teile = Anzahl möglicher
    // Crafts) anheben, ohne beim Tauschpartner dessen Engpass zu senken.
    // Das findet auch Trades, bei denen ein Spieler bei ALLEN Teilen mehr
    // hat als der andere - reine Differenzbetrachtung würde die übersehen.
    const a = [...p1];
    const b = [...p2];
    const unitTrades = [];
    let safety = 0;

    while (safety++ < 5000) {
      const minA = Math.min(...a);
      const minB = Math.min(...b);
      const bottleneckB = parts.map((_, i) => i).filter((i) => b[i] === minB);
      const bottleneckA = parts.map((_, i) => i).filter((i) => a[i] === minA);

      let giveIdx = -1;
      let getIdx = -1;

      // Über alle grundsätzlich gültigen Swaps suchen und NUR einen nehmen,
      // der auch wirklich min(A) oder min(B) erhöht - nicht nur irgendein
      // Item verschiebt, das zufällig (mit-)am alten Minimum lag. Bei
      // Gleichstand mehrerer Teile am Minimum bringt das Anheben von nur
      // einem davon sonst keinen zusätzlichen Craft.
      outer: for (const gi of bottleneckB) {
        if (a[gi] <= minA) continue;
        for (const ri of bottleneckA) {
          if (ri === gi) continue;
          if (b[ri] <= minB) continue;

          const aTest = [...a];
          const bTest = [...b];
          aTest[gi]--;
          aTest[ri]++;
          bTest[gi]++;
          bTest[ri]--;
          const newMinA = Math.min(...aTest);
          const newMinB = Math.min(...bTest);

          if (newMinA > minA || newMinB > minB) {
            giveIdx = gi;
            getIdx = ri;
            break outer;
          }
        }
      }

      if (giveIdx === -1) break; // kein Swap mehr, der tatsächlich einen Craft bringt

      a[giveIdx]--;
      a[getIdx]++;
      b[giveIdx]++;
      b[getIdx]--;
      unitTrades.push({ giveIdx, getIdx });
    }

    // Einzel-Swaps zu Trade-Zeilen zusammenfassen
    const merged = {};
    unitTrades.forEach((t) => {
      const key = `${t.giveIdx}-${t.getIdx}`;
      merged[key] = (merged[key] || 0) + 1;
    });
    const trades = Object.entries(merged).map(([key, amount]) => {
      const [giveIdx, getIdx] = key.split("-").map(Number);
      return { give: parts[giveIdx].label, get: parts[getIdx].label, amount };
    });

    const p1CraftsAfter = Math.min(...a);
    const p2CraftsAfter = Math.min(...b);

    const out = document.getElementById("output");
    let html = "";

    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem">`;
    [
      { name: p1Name, before: p1CraftsBefore, after: p1CraftsAfter },
      { name: p2Name, before: p2CraftsBefore, after: p2CraftsAfter },
    ].forEach((p) => {
      const improvement = p.after - p.before;
      html += `<div style="background:var(--surface-1);border-radius:var(--radius);padding:0.75rem 1rem">
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">${p.name}</div>
        <div style="font-size:20px;font-weight:500">${p.before} &rarr; ${p.after} Crafts${
        improvement > 0 ? ` <span style="font-size:13px;color:#8fd18f">(+${improvement})</span>` : ""
      }</div>
      </div>`;
    });
    html += `</div>`;

    if (trades.length === 0) {
      html += `<div class="trade-line">Keine sinnvollen Trades gefunden - eure Engpässe lassen sich untereinander nicht mehr verbessern.</div>`;
    } else {
      html += trades
        .map(
          (t) =>
            `<div class="trade-line">${p1Name} gibt <b>${t.amount}x ${t.give}</b> &rarr; bekommt <b>${t.amount}x ${t.get}</b></div>`
        )
        .join("");
    }

    out.innerHTML = html;
  }

  document.getElementById("calcBtn").addEventListener("click", calcTrades);
</script>
</body>
</html>
